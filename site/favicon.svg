<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="PlantOmics Hub">
  <title>PlantOmics Hub</title>
  <!-- 与 market/assets/icon.svg 同一个标记：深绿底 + 中心叶片 + 六个来源节点。
       16px 下辐条会糊成脏点，所以这一版去掉连线、放大叶片，只留承重的形状。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3524"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e2f9b0"/>
      <stop offset="1" stop-color="#63d296"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <path d="M16 6.5 C20.4 9.9 21 15 16 20 C11 15 11.6 9.9 16 6.5 Z" fill="url(#leaf)"/>
  <g fill="#c8f2da">
    <circle cx="9" cy="22.6" r="1.7"/>
    <circle cx="12.4" cy="25.5" r="1.3" opacity="0.8"/>
    <circle cx="19.6" cy="25.5" r="1.3" opacity="0.8"/>
    <circle cx="23" cy="22.6" r="1.7"/>
  </g>
</svg>
