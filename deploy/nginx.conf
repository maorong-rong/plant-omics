# /etc/nginx/sites-available/datamcp —— 线上配置的镜像副本
#
# 来源：2026-10-31 19:45 CST 从服务器 `cat /etc/nginx/sites-available/datamcp` 抄回，逐字一致
#       （含 certbot 写入的 `# managed by Certbot` 行）。
# 服务器上真实生效的是 `/etc/nginx/sites-available/datamcp`（`sites-enabled/datamcp` 软链）。
# 改这份之后必须同步到服务器并 `nginx -t && systemctl reload nginx`；反向也要抄回来。
#
# ⚠ 本文件在 certbot 续期/重签时会被自动改写：`--nginx` 插件会重写 ssl_certificate 行、
#   插入 acme-challenge 临时块。续期后请重新抄回，别假设仓库这份永远是线上现状。
#
# 历史差异（2026-10-31 实测，供对照）：
#   改 HTTPS 前：proxy_read_timeout 300s（不是旧文档的 3600s）；无 upstream/keepalive 块；
#                无 443 块；无安全响应头；只有一个 server 块、无 default_server。
#   改 HTTPS 后：多出 443 块 + 80 跳转块；80 块对非域名 Host 变成 `return 404`。

server {
    server_name datamcp.moilab.net;            # 线上另有公网 IP 参与 server_name，此处脱敏省略

    client_max_body_size 2m;

    location /mcp {
        proxy_pass http://127.0.0.1:8787/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;              # 服务端 Host 白名单靠它，改写成别的值会 403
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                      # 流式回包被攒住会看起来"卡死"
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_set_header Host $host;
    }

    # /catalog 是服务的对外契约面（版本化目录 JSON），语义归后端负责人。
    # 必须显式精确匹配：否则落到 location / 的静态兜底，会被当成不存在的文件。
    location = /catalog {
        proxy_pass http://127.0.0.1:8787/catalog;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /srv/plantomics-hub/site;
        # 2026-11-01 改：兜底 index.html 会让任何拼错路径都返回 200 + 首页 HTML
        # （"200 但不是 JSON"的假活就是这么来的）。文件不存在就 404，不再兜首页。
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/datamcp.moilab.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/datamcp.moilab.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 80 端口只做跳转。注意两条副作用，都是 certbot 生成的：
#   1) 只有 Host = datamcp.moilab.net 才 301，其它 Host（含裸 IP、127.0.0.1）拿到 `return 404`。
#      所以任何"用 IP 或空 Host 打 80"的检查都会红——巡检脚本改走 https + --resolve，见 deploy/check.sh。
#   2) 没有 default_server，未知 Host 命中本块后 404；若要更严格可另加 default_server 返回 444。
server {
    if ($host = datamcp.moilab.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name datamcp.moilab.net;            # 线上另有公网 IP 参与 server_name，此处脱敏省略
    return 404; # managed by Certbot
}

