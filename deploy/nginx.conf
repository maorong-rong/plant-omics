# PlantOmics Hub —— Nginx 反代（部署物料，未在本机验证）
#
# 放置：/etc/nginx/sites-available/plantomics-hub.conf，再
#   ln -s /etc/nginx/sites-available/plantomics-hub.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 为什么这样配：
#   1. Streamable HTTP 的 MCP 连接可能长时间空闲（工具调用含重试，最长约 45 s），
#      **必须关掉代理缓冲**（proxy_buffering off），否则报文会被攒着、看起来像卡死；
#   2. `proxy_read_timeout` 给足（默认 60 s 偏短），空闲长连接才不会莫名被切；
#   3. 上游（本服务）只监听 127.0.0.1，公网只经由这里；
#   4. `Host` 要原样透传：服务端有 Host 白名单（PLANTOMICS_HUB_ALLOWED_HOSTS），
#      把域名改成别的东西会 403。
#
# 把 example.org 换成你的域名；证书路径按 certbot 生成的实际路径填。

upstream plantomics_hub {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.org;

    # certbot --webroot 用；纯 HTTP 调试阶段可先留着
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.org;

    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 客户端上传的只有 JSON-RPC，给个保守上限
    client_max_body_size 1m;

    # ── MCP 端点 ──
    location /mcp {
        proxy_pass http://plantomics_hub;
        proxy_http_version 1.1;

        # Host 原样透传（服务端白名单靠它判）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关缓冲 + 长超时：否则长连接/流式回包会被攒住
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # SSE 兼容头（服务端按需返回 text/event-stream 时不压缩、不缓存）
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no always;
    }

    # ── 健康检查（给云负载均衡/监控用，不对外暴露细节） ──
    location = /healthz {
        proxy_pass http://plantomics_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        access_log off;
    }

    # 其它路径一律 404，避免把服务端当成通用站点
    location / {
        return 404;
    }
}
